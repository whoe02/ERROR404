{% extends "base.html" %}
{% block title %}Order #{{ order.id }} — ERROR404 Store{% endblock %}
{% block content %}
<h1>🧾 Order #{{ order.id }}</h1>
<div class="card">
  <div class="stat"><span>Total</span><span class="v">${{ "%.2f"|format(order.total_cents / 100) }}</span></div>
  <div class="stat"><span>SKU</span><span class="v">{{ sku }}</span></div>
  <div class="stat"><span>Placed</span><span class="v">{{ order.created_at }}</span></div>
</div>
<p class="muted-link"><a href="#" onclick="downloadReceipt({{ order.id }}); return false;">Download text receipt</a> · <a href="/products">Continue shopping</a></p>
<script>
async function downloadReceipt(orderId) {
  try {
    const res = await fetch(`/orders/${orderId}/export`);
    const text = await res.text();
    if (!res.ok) {
      alert("Could not download receipt: " + text);
      return;
    }
    const blob = new Blob([text], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `order-${orderId}-receipt.txt`;
    a.click();
    URL.revokeObjectURL(url);
  } catch (e) {
    alert("Could not download receipt: " + e.message);
  }
}
</script>
{% endblock %}
