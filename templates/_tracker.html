{% if workflow_id %}
<div class="card" id="fix-card">
  <h2 style="font-size:1rem;margin:0 0 14px;">🩹 Autocure is on it</h2>
  <div class="status-line">
    <div class="status-dot" id="status-dot"></div>
    <div>
      <div class="status-text" id="status-text">Queued…</div>
      <div class="status-sub" id="status-sub"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast" style="display:none;">
  <span id="toast-text"></span>
  <button type="button" id="toast-close" aria-label="Dismiss">✕</button>
</div>
{% elif autocure_error %}
<div class="card"><div class="flash err">Could not reach Autocure: {{ autocure_error }}</div></div>
{% endif %}

<style>
  .status-line { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); flex: none; animation: pulse 1.4s infinite; }
  .status-dot.done { background: var(--ok); animation: none; }
  .status-dot.failed { background: var(--err); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .status-text { font-size: 0.95rem; font-weight: 600; }
  .status-sub { color: var(--muted); font-size: 0.8rem; }
  .toast {
    position: fixed; top: 20px; right: 20px; z-index: 1000; max-width: 360px;
    display: flex; align-items: center; gap: 12px;
    border-radius: 8px; padding: 12px 14px; font-size: 0.88rem;
    border: 1px solid var(--border); background: var(--bg);
    box-shadow: 0 8px 24px rgba(0,0,0,0.35);
  }
  .toast.approval { border-color: var(--warn); background: color-mix(in srgb, var(--warn) 15%, var(--bg)); }
  .toast.commit { border-color: var(--ok); background: color-mix(in srgb, var(--ok) 15%, var(--bg)); }
  .toast.error { border-color: var(--err); background: color-mix(in srgb, var(--err) 15%, var(--bg)); }
  .toast span { flex: 1; }
  .toast button {
    background: none; border: none; color: inherit; cursor: pointer;
    font-size: 0.9rem; opacity: 0.6; line-height: 1; padding: 2px;
  }
  .toast button:hover { opacity: 1; }
</style>

{% if workflow_id %}
<script>
const STATUS_LABELS = {
  queued: "Queued", running: "Running",
  awaiting_approval: "Awaiting human approval in Telegram", awaiting_deploy: "Awaiting deployment",
  completed: "Fix committed", failed: "Workflow failed", cancelled: "Workflow cancelled",
};
function fmtTime(iso) { return iso ? new Date(iso).toLocaleTimeString() : ""; }
function setHeader(text, sub, dotClass) {
  document.getElementById("status-text").textContent = text;
  document.getElementById("status-sub").textContent = sub || "";
  document.getElementById("status-dot").className = "status-dot" + (dotClass ? " " + dotClass : "");
}
let lastToastKey = null;
function showToast(key, text, cls) {
  if (key === lastToastKey) return;
  lastToastKey = key;
  const el = document.getElementById("toast");
  document.getElementById("toast-text").textContent = text;
  el.className = "toast" + (cls ? " " + cls : "");
  el.style.display = "flex";
}
document.getElementById("toast-close")?.addEventListener("click", () => {
  document.getElementById("toast").style.display = "none";
});
let pollTimer = null;
async function poll() {
  try {
    const res = await fetch("/api/workflow-status/{{ workflow_id }}");
    if (!res.ok) { showToast("http-error", `Status check failed (HTTP ${res.status})`, "error"); return; }
    const data = await res.json();
    if (data.status === "awaiting_approval") {
      setHeader(STATUS_LABELS.awaiting_approval, "", "");
      showToast("awaiting_approval", "⚠️ Fix ready — go approve the card in the connected Telegram group.", "approval");
    } else if (data.status === "completed") {
      setHeader(STATUS_LABELS.completed, `Finished at ${fmtTime(data.completed_at)}`, "done");
      showToast("completed", "✅ Fix committed to staging.", "commit");
      clearInterval(pollTimer);
    } else if (data.status === "failed" || data.status === "cancelled") {
      setHeader(STATUS_LABELS[data.status] || data.status, "", "failed");
      showToast(data.status, "❌ Workflow " + data.status + ".", "error");
      clearInterval(pollTimer);
    } else {
      setHeader(STATUS_LABELS[data.status] || data.status, data.current_stage ? `Stage: ${data.current_stage}` : "", "");
    }
  } catch (e) {
    showToast("fetch-error", "Status check error: " + e.message, "error");
  }
}
poll();
pollTimer = setInterval(poll, 4000);
</script>
{% endif %}
