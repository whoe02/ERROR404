{% if workflow_id %}
<div class="card" id="fix-card">
  <h2 style="font-size:1rem;margin:0 0 14px;">🩹 Autocure is on it</h2>
  <div class="status-line">
    <div class="status-dot" id="status-dot"></div>
    <div>
      <div class="status-text" id="status-text">Queued…</div>
      <div class="status-sub" id="status-sub"></div>
    </div>
  </div>
  <div class="banner" id="banner" style="display:none;"></div>
</div>
{% elif autocure_error %}
<div class="card"><div class="flash err">Could not reach Autocure: {{ autocure_error }}</div></div>
{% endif %}

<style>
  .status-line { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); flex: none; animation: pulse 1.4s infinite; }
  .status-dot.done { background: var(--ok); animation: none; }
  .status-dot.failed { background: var(--err); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .status-text { font-size: 0.95rem; font-weight: 600; }
  .status-sub { color: var(--muted); font-size: 0.8rem; }
  .banner { border-radius: 8px; padding: 10px 14px; font-size: 0.88rem; border: 1px solid var(--border); }
  .banner.approval { background: color-mix(in srgb, var(--warn) 15%, transparent); border-color: var(--warn); }
  .banner.commit { background: color-mix(in srgb, var(--ok) 15%, transparent); border-color: var(--ok); }
  .banner.error { background: color-mix(in srgb, var(--err) 15%, transparent); border-color: var(--err); }
</style>

{% if workflow_id %}
<script>
const STATUS_LABELS = {
  queued: "Queued", running: "Running",
  awaiting_approval: "Awaiting human approval in Telegram", awaiting_deploy: "Awaiting deployment",
  completed: "Fix committed", failed: "Workflow failed", cancelled: "Workflow cancelled",
};
function fmtTime(iso) { return iso ? new Date(iso).toLocaleTimeString() : ""; }
function setHeader(text, sub, dotClass) {
  document.getElementById("status-text").textContent = text;
  document.getElementById("status-sub").textContent = sub || "";
  document.getElementById("status-dot").className = "status-dot" + (dotClass ? " " + dotClass : "");
}
function setBanner(text, cls) {
  const el = document.getElementById("banner");
  if (!text) { el.style.display = "none"; return; }
  el.textContent = text;
  el.className = "banner" + (cls ? " " + cls : "");
  el.style.display = "block";
}
let pollTimer = null;
async function poll() {
  try {
    const res = await fetch("/api/workflow-status/{{ workflow_id }}");
    if (!res.ok) { setBanner(`Status check failed (HTTP ${res.status})`, "error"); return; }
    const data = await res.json();
    if (data.status === "awaiting_approval") {
      setHeader(STATUS_LABELS.awaiting_approval, "", "");
      setBanner("⚠️ Fix ready — go approve the card in the connected Telegram group.", "approval");
    } else if (data.status === "completed") {
      setHeader(STATUS_LABELS.completed, `Finished at ${fmtTime(data.completed_at)}`, "done");
      setBanner("✅ Fix committed to staging.", "commit");
      clearInterval(pollTimer);
    } else if (data.status === "failed" || data.status === "cancelled") {
      setHeader(STATUS_LABELS[data.status] || data.status, "", "failed");
      setBanner("❌ Workflow " + data.status + ".", "error");
      clearInterval(pollTimer);
    } else {
      setHeader(STATUS_LABELS[data.status] || data.status, data.current_stage ? `Stage: ${data.current_stage}` : "", "");
      setBanner(null);
    }
  } catch (e) {
    setBanner("Status check error: " + e.message, "error");
  }
}
poll();
pollTimer = setInterval(poll, 4000);
</script>
{% endif %}
