{% extends "base.html" %}
{% block title %}Sign up — ERROR404 Store{% endblock %}
{% block wrapclass %} narrow{% endblock %}
{% block content %}
<h1 style="text-align:center;">Create an account</h1>
<div class="card">
  {% if error %}<script>alert({{ error|tojson }});</script>{% endif %}
  <form method="post" action="/signup">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" required />
    <label for="email">Email</label>
    <input type="text" id="email" name="email" required />
    <label for="password">Password</label>
    <input type="password" id="password" name="password" required />
    <button type="submit" style="width:100%;">Sign up</button>
  </form>
</div>
<p class="muted-link" style="text-align:center;">Already have an account? <a href="/login">Log in</a></p>
{% endblock %}
