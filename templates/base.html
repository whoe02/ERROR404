<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}ERROR404 Store{% endblock %}</title>
<style>
  :root {
    --bg: #0a0c11;
    --panel: #12151d;
    --panel-2: #161a24;
    --border: #232837;
    --text: #eef0f4;
    --muted: #8891a3;
    --accent: #6d8bff;
    --accent-2: #9b6dff;
    --ok: #35c47a;
    --err: #ff6b6b;
    --warn: #f4b740;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(900px 500px at 15% -10%, rgba(109,139,255,0.12), transparent 60%),
      radial-gradient(700px 500px at 100% 0%, rgba(155,109,255,0.10), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  nav {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 14px 28px;
    border-bottom: 1px solid var(--border);
    background: rgba(10,12,17,0.75);
    backdrop-filter: blur(10px);
  }
  nav .brand {
    font-weight: 700;
    margin-right: auto;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 1.02rem;
    color: var(--text);
  }
  nav .brand .logo {
    width: 30px; height: 30px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 9px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    font-size: 1rem;
  }
  nav a { color: var(--muted); text-decoration: none; font-size: 0.88rem; font-weight: 500; transition: color .15s; }
  nav a:hover { color: var(--text); text-decoration: none; }

  .wrap { max-width: 680px; margin: 0 auto; padding: 48px 20px 96px; }
  .wrap.narrow { max-width: 420px; padding-top: 72px; }
  h1 { font-size: 1.6rem; margin: 0 0 22px; letter-spacing: -0.02em; }
  h2 { letter-spacing: -0.01em; }

  .card {
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 1rem; margin: 0 0 16px; color: var(--text); }

  label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; margin-top: 14px; font-weight: 500; }
  label:first-child { margin-top: 0; }
  input, select {
    width: 100%;
    padding: 11px 13px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #0d0f15;
    color: var(--text);
    font-size: 0.95rem;
    transition: border-color .15s, box-shadow .15s;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(109,139,255,0.18);
  }

  button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    border-radius: 10px;
    padding: 12px 20px;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 20px;
    box-shadow: 0 6px 16px -6px rgba(109,139,255,0.5);
    transition: transform .12s, box-shadow .12s, filter .12s;
  }
  button:hover { transform: translateY(-1px); filter: brightness(1.06); }
  button:active { transform: translateY(0); }

  .product-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 14px 0;
    border-bottom: 1px solid var(--border);
  }
  .product-row:last-child { border-bottom: none; }
  .product-row .info { display: flex; align-items: center; gap: 14px; }
  .product-row .icon {
    width: 42px; height: 42px; flex: none;
    display: flex; align-items: center; justify-content: center;
    border-radius: 11px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    font-size: 1.2rem;
  }
  .product-row .name { font-weight: 600; font-size: 0.95rem; }
  .price { color: var(--muted); font-size: 0.82rem; margin-top: 2px; }

  .flash { padding: 13px 16px; border-radius: 10px; margin-bottom: 18px; font-size: 0.88rem; }
  .flash.err { background: rgba(255,107,107,0.1); border: 1px solid rgba(255,107,107,0.3); color: var(--err); }
  .flash.ok { background: rgba(53,196,122,0.1); border: 1px solid rgba(53,196,122,0.3); color: var(--ok); }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .stat-tile {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
  }
  .stat-tile .label { color: var(--muted); font-size: 0.78rem; margin-bottom: 6px; }
  .stat-tile .value { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.02em; }

  .stat { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; font-size: 0.9rem; border-bottom: 1px solid var(--border); }
  .stat:last-child { border-bottom: none; }
  .stat .v { font-weight: 600; }

  .muted-link { color: var(--muted); font-size: 0.88rem; }
</style>
</head>
<body>
<nav>
  <span class="brand"><span class="logo">🛒</span> ERROR404 Store</span>
  {% if customer %}
    <a href="/dashboard">Dashboard</a>
    <a href="/products">Products</a>
    <a href="/reports">Reports</a>
    <a href="/logout">Logout ({{ customer.email }})</a>
  {% else %}
    <a href="/login">Login</a>
    <a href="/signup">Sign up</a>
  {% endif %}
</nav>
<div class="wrap{% block wrapclass %}{% endblock %}">
{% block content %}{% endblock %}
</div>
</body>
</html>
