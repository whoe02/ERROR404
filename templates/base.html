<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{% block title %}ERROR404 Store{% endblock %}</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #141821;
    --border: #262c3a;
    --text: #e6e9ef;
    --muted: #8891a3;
    --accent: #5b8cff;
    --ok: #35c47a;
    --err: #ff5d5d;
    --warn: #f4b740;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  a { color: var(--accent); }
  nav {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
  }
  nav .brand { font-weight: 700; margin-right: auto; }
  nav a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
  nav a:hover { color: var(--text); }
  .wrap { max-width: 640px; margin: 0 auto; padding: 40px 20px 80px; }
  h1 { font-size: 1.4rem; margin: 0 0 20px; }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 18px;
  }
  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 6px; margin-top: 12px; }
  label:first-child { margin-top: 0; }
  input, select {
    width: 100%;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #0e1117;
    color: var(--text);
    font-size: 0.95rem;
  }
  button {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 18px;
  }
  button:hover { filter: brightness(1.08); }
  .product-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .product-row:last-child { border-bottom: none; }
  .price { color: var(--muted); font-size: 0.85rem; }
  .flash { padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; font-size: 0.9rem; }
  .flash.err { background: rgba(255,93,93,0.1); border: 1px solid rgba(255,93,93,0.35); color: var(--err); }
  .flash.ok { background: rgba(53,196,122,0.1); border: 1px solid rgba(53,196,122,0.35); color: var(--ok); }
  .stat { display: flex; justify-content: space-between; padding: 8px 0; font-size: 0.9rem; }
  .stat .v { font-weight: 600; }
</style>
</head>
<body>
<nav>
  <span class="brand">🛒 ERROR404 Store</span>
  {% if customer %}
    <a href="/dashboard">Dashboard</a>
    <a href="/products">Products</a>
    <a href="/logout">Logout ({{ customer.email }})</a>
  {% else %}
    <a href="/login">Login</a>
    <a href="/signup">Sign up</a>
  {% endif %}
</nav>
<div class="wrap">
{% block content %}{% endblock %}
</div>
</body>
</html>
