name: Auto Deploy on Merge

on:
  push:
    branches:
      - staging
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy on self-hosted runner
    runs-on: [self-hosted, linux]

    env:
      APP_DIR: /opt/repo/ERROR404
      DEPLOY_BRANCH: staging
      SERVICE_NAME: error404
      DEPLOY_SCRIPT: /opt/actions-runner-error404/deploy.sh

    steps:
      - name: Deploy application
        run: |
          set -euo pipefail
          echo "Deploy started at $(date -Is)"
          echo "Runner host: $(hostname)"
          echo "Commit: ${GITHUB_SHA}"
          test -f "${DEPLOY_SCRIPT}"
          chmod +x "${DEPLOY_SCRIPT}"
          bash "${DEPLOY_SCRIPT}"
          echo "Deploy finished at $(date -Is)"
