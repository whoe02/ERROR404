<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ERROR404 — Autocure Live Demo</title>
<style>
  :root {
    --bg: #0b0d12;
    --panel: #141821;
    --border: #262c3a;
    --text: #e6e9ef;
    --muted: #8891a3;
    --accent: #5b8cff;
    --ok: #35c47a;
    --err: #ff5d5d;
    --warn: #f4b740;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 48px 20px 80px; }
  header { margin-bottom: 32px; }
  h1 { font-size: 1.5rem; margin: 0 0 6px; }
  .sub { color: var(--muted); font-size: 0.9rem; }
  .repo-info { color: var(--muted); font-size: 0.8rem; margin-top: 10px; font-family: ui-monospace, monospace; }

  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 24px;
    margin-bottom: 20px;
  }
  .card h2 { font-size: 1rem; margin: 0 0 14px; color: var(--text); }

  .scenario-list { display: flex; flex-direction: column; gap: 8px; }

  button {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
  }
  button.scenario-btn { background: #171c27; }
  button:disabled { opacity: 0.5; cursor: default; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.scenario-btn.active { border-color: var(--accent); background: rgba(91,140,255,0.12); }

  .hint { font-size: 0.8rem; color: var(--muted); margin-top: 10px; }

  .result { margin-top: 16px; padding: 14px 16px; border-radius: 8px; font-size: 0.9rem; display: none; }
  .result.ok { display: block; background: rgba(53,196,122,0.1); border: 1px solid rgba(53,196,122,0.35); color: var(--ok); }
  .result.err { display: block; background: rgba(255,93,93,0.1); border: 1px solid rgba(255,93,93,0.35); color: var(--err); }

  #fix-card { display: none; }
  .status-line { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .status-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); flex: none; animation: pulse 1.4s infinite; }
  .status-dot.done { background: var(--ok); animation: none; }
  .status-dot.failed { background: var(--err); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  .status-text { font-size: 0.95rem; font-weight: 600; }
  .status-sub { color: var(--muted); font-size: 0.8rem; }

  ul.timeline { list-style: none; margin: 0; padding: 0; }
  ul.timeline li {
    position: relative;
    padding: 0 0 18px 26px;
    border-left: 2px solid var(--border);
    font-size: 0.88rem;
  }
  ul.timeline li:last-child { border-left-color: transparent; padding-bottom: 0; }
  ul.timeline li::before {
    content: "";
    position: absolute;
    left: -6px;
    top: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent);
    border: 2px solid var(--bg);
  }
  ul.timeline li .t { color: var(--muted); font-size: 0.75rem; margin-right: 8px; font-family: ui-monospace, monospace; }
  ul.timeline li.approval::before { background: var(--warn); }
  ul.timeline li.commit::before { background: var(--ok); }
  ul.timeline li.error::before { background: var(--err); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🛒 ERROR404 Storefront</h1>
    <div class="sub">A tiny checkout demo wired to Autocure's self-healing loop.</div>
    <div class="repo-info" id="repo-info">loading repo info…</div>
  </header>

  <div class="card">
    <h2>Trigger a bug (one click, no typing)</h2>
    <div class="scenario-list" id="scenario-list">Loading scenarios…</div>
    <div class="hint">Each button calls <code>POST /api/trigger/&lt;scenario&gt;</code>, which runs one real bug in order.py.</div>
    <div class="result" id="result"></div>
  </div>

  <div class="card" id="fix-card">
    <h2>🩹 Autocure is on it</h2>
    <div class="status-line">
      <div class="status-dot" id="status-dot"></div>
      <div>
        <div class="status-text" id="status-text">Queued…</div>
        <div class="status-sub" id="status-sub"></div>
      </div>
    </div>
    <ul class="timeline" id="timeline"></ul>
  </div>
</div>

<script>
const STAGE_LABELS = {
  incident: "Opening incident",
  planner: "Planning the fix",
  planning: "Planning the fix",
  knowledge: "Searching prior knowledge",
  context: "Building source context",
  rootcause: "Running root-cause analysis",
  root_cause: "Running root-cause analysis",
  codegen: "Generating the patch",
  reviewer: "Reviewing the patch",
  review: "Reviewing the patch",
  security: "Running security scan",
  performance: "Running performance analysis",
  deployment: "Preparing deployment",
};

const STATUS_LABELS = {
  queued: "Queued",
  running: "Running",
  awaiting_approval: "Awaiting human approval in Telegram",
  awaiting_deploy: "Awaiting deployment",
  completed: "Fix committed",
  failed: "Workflow failed",
  cancelled: "Workflow cancelled",
};

let seen = new Set();
let pollTimer = null;

function fmtTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  return d.toLocaleTimeString();
}

function addTimelineEntry(text, cls) {
  const key = cls + ":" + text;
  if (seen.has(key)) return;
  seen.add(key);
  const li = document.createElement("li");
  if (cls) li.className = cls;
  const t = document.createElement("span");
  t.className = "t";
  t.textContent = new Date().toLocaleTimeString();
  li.appendChild(t);
  li.appendChild(document.createTextNode(text));
  document.getElementById("timeline").appendChild(li);
}

function setStatusHeader(text, sub, dotClass) {
  document.getElementById("status-text").textContent = text;
  document.getElementById("status-sub").textContent = sub || "";
  document.getElementById("status-dot").className = "status-dot" + (dotClass ? " " + dotClass : "");
}

async function loadRepoInfo() {
  try {
    const res = await fetch("/api/repo-info");
    const data = await res.json();
    document.getElementById("repo-info").textContent =
      `branch: ${data.branch}  ·  commit: ${data.commit_sha.slice(0, 7)}`;
  } catch (e) {
    document.getElementById("repo-info").textContent = "repo info unavailable";
  }
}

async function pollWorkflow(workflowId) {
  try {
    const res = await fetch(`/api/workflow-status/${workflowId}`);
    if (!res.ok) {
      addTimelineEntry(`Status check failed (HTTP ${res.status})`, "error");
      return;
    }
    const data = await res.json();
    const status = data.status;
    const stage = data.current_stage;

    if (stage && STAGE_LABELS[stage]) {
      addTimelineEntry(STAGE_LABELS[stage], "");
    }

    if (status === "awaiting_approval") {
      setStatusHeader(STATUS_LABELS.awaiting_approval, "Go approve the fix card in the connected Telegram group.", "");
      addTimelineEntry("Fix ready — Telegram approval card sent", "approval");
    } else if (status === "completed") {
      setStatusHeader(STATUS_LABELS.completed, `Finished at ${fmtTime(data.completed_at)}`, "done");
      addTimelineEntry("Fix committed to staging ✅", "commit");
      stopPolling();
    } else if (status === "failed" || status === "cancelled") {
      setStatusHeader(STATUS_LABELS[status] || status, data.error_summary || "", "failed");
      addTimelineEntry("Workflow " + status, "error");
      stopPolling();
    } else {
      setStatusHeader(STATUS_LABELS[status] || status, stage ? `Stage: ${stage}` : "", "");
    }
  } catch (e) {
    addTimelineEntry("Status check error: " + e.message, "error");
  }
}

function stopPolling() {
  if (pollTimer) {
    clearInterval(pollTimer);
    pollTimer = null;
  }
}

function startTracking(workflowId) {
  seen = new Set();
  document.getElementById("timeline").innerHTML = "";
  document.getElementById("fix-card").style.display = "block";
  setStatusHeader("Queued…", "", "");
  addTimelineEntry("Exception reported to Autocure", "");
  stopPolling();
  pollWorkflow(workflowId);
  pollTimer = setInterval(() => pollWorkflow(workflowId), 4000);
}

async function loadScenarios() {
  const list = document.getElementById("scenario-list");
  try {
    const res = await fetch("/api/scenarios");
    const scenarios = await res.json();
    list.innerHTML = "";
    for (const [key, s] of Object.entries(scenarios)) {
      const btn = document.createElement("button");
      btn.className = "scenario-btn";
      btn.textContent = s.label;
      btn.dataset.key = key;
      btn.addEventListener("click", () => triggerScenario(key, btn));
      list.appendChild(btn);
    }
  } catch (e) {
    list.textContent = "Failed to load scenarios: " + e.message;
  }
}

async function triggerScenario(key, btn) {
  const buttons = document.querySelectorAll(".scenario-btn");
  buttons.forEach((b) => { b.disabled = true; b.classList.remove("active"); });
  btn.classList.add("active");
  const result = document.getElementById("result");
  result.className = "result";
  result.style.display = "none";

  try {
    const res = await fetch(`/api/trigger/${key}`, { method: "POST" });
    const data = await res.json();

    result.style.display = "block";
    if (data.ok) {
      result.className = "result ok";
      result.textContent = "✅ No error — result: " + JSON.stringify(data.result);
    } else {
      result.className = "result err";
      result.textContent = "🔥 " + data.error;
      const wf = data.autocure && data.autocure.workflow_id;
      if (wf) {
        startTracking(wf);
      } else if (data.autocure && data.autocure.error) {
        addTimelineEntry(data.autocure.error, "error");
      }
    }
  } catch (e) {
    result.className = "result err";
    result.textContent = "Request failed: " + e.message;
  } finally {
    buttons.forEach((b) => { b.disabled = false; });
  }
}

loadRepoInfo();
loadScenarios();
</script>
</body>
</html>
